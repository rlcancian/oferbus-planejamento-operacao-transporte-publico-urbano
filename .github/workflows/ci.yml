name: OferBus CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/oferbus-core[dev] -e packages/oferbus-db[dev] -e packages/oferbus-jobs[dev] -e packages/oferbus-ai[dev] -e packages/oferbus-planning[dev] -e apps/api[dev] -e apps/worker[dev] -e reference-core
      - name: Ruff
        run: ruff check packages apps reference-core scripts
      - name: Pytest
        run: pytest

  postgres-api-worker:
    name: PostgreSQL, migrations, API and worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oferbus
          POSTGRES_USER: oferbus
          POSTGRES_PASSWORD: oferbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oferbus -d oferbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://oferbus:oferbus@localhost:5432/oferbus
      OFERBUS_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/oferbus-core -e packages/oferbus-db -e packages/oferbus-jobs -e packages/oferbus-ai -e packages/oferbus-planning -e apps/api -e apps/worker -e reference-core
      - name: Run migrations
        run: alembic upgrade head
      - name: Integration smoke
        run: python scripts/integration_smoke.py

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
