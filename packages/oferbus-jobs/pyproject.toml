[project]
name = "oferbus-jobs"
version = "0.1.0"
description = "OferBus asynchronous computation queue and lifecycle"
requires-python = ">=3.13,<3.15"
dependencies = [
  "oferbus-db==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
