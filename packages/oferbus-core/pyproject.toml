[project]
name = "oferbus-core"
version = "0.1.0"
description = "Deterministic production planning contracts and computational engine for OferBus"
requires-python = ">=3.12,<3.15"
dependencies = [
  "oferbus-legacy-core-reference==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
