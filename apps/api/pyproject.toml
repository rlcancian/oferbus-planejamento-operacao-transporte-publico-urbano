[project]
name = "oferbus-api"
version = "0.9.0"
description = "OferBus 2026 application API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
  "oferbus-ai==0.1.0",
  "oferbus-core==0.1.0",
  "oferbus-db==0.1.0",
  "oferbus-jobs==0.1.0",
  "oferbus-planning==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
