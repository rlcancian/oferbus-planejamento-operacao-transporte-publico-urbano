[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oferbus-legacy-core-reference"
version = "0.1.0"
description = "Source-derived executable reference models for OferBus archaeology"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
